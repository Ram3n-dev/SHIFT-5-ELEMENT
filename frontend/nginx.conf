server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API и возврат из Google уходят в контейнер backend.
    # $http_host сохраняет порт (localhost:8080) — по нему backend строит адрес возврата для Google.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /signin-google {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker и манифест не кэшируем, чтобы обновления доходили сразу
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Файлы сборки с хешем в имени можно кэшировать надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Маршруты React (/dashboard, /settings и т. д.) отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
